name: Auto Fetch InitialDAC JSON (v2 - optimized, no tmp commit)

on:
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set round number (fixed for now)
        id: round
        run: |
          ROUND=72
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      - name: Fetch JSON (parallel)
        run: |
          ROUND=${{ steps.round.outputs.round }}
          mkdir -p tmp

          export ROUND

          seq 0 62 | xargs -I{} -P 20 sh -c '
            AREA={}
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${AREA}.json"
            echo "Fetching $URL"
            curl -f -s "$URL" -o tmp/area-${AREA}.json || echo "{}" > tmp/area-${AREA}.json
          '

      - name: Merge JSON (single jq pass)
        run: |
          ROUND=${{ steps.round.outputs.round }}

          jq -s --arg round "$ROUND" '
            (map(.calcDate // empty) | sort | last) as $max
            |
            {
              round: $round,
              generatedAt: $max,
              records: (
                map(.records // [])
                | add
                | map(del(.calcDate))
              )
            }
          ' tmp/*.json > "round${ROUND}.json"

      - name: Commit & Push (only if changed)
        run: |
          ROUND=${{ steps.round.outputs.round }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # tmp/ はコミットしない
          git add "round${ROUND}.json"

          # 変更がなければ終了
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update: round ${ROUND}"
          git push
