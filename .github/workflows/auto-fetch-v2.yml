name: Auto Fetch InitialDAC JSON (v2)

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Round number"
        required: true
        default: "72"

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Determine round
        id: round
        run: |
          # Cloudflare Worker から渡された round を使用
          ROUND="${{ github.event.inputs.round }}"
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      - name: Fetch JSON
        run: |
          ROUND=${{ steps.round.outputs.round }}
          mkdir -p tmp

          # 63エリア分を取得
          for AREA in $(seq -w 1 63); do
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${AREA}.json"
            echo "Fetching $URL"
            curl -s "$URL" -o "tmp/round-${ROUND}_area-${AREA}.json"
          done

      - name: Merge JSON
        run: |
          ROUND=${{ steps.round.outputs.round }}
          jq -s '{round: $ROUND, generatedAt: now, data: .}' tmp/*.json > latest.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest.json tmp/
          git commit -m "Auto update: round ${{ steps.round.outputs.round }}" || echo "No changes"
          git push
