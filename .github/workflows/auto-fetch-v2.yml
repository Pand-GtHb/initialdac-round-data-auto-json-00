name: Auto Fetch InitialDAC JSON (v2)

on:
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read latest.json
        id: latest
        run: |
          if [ -f latest.json ]; then
            ROUND=$(jq -r '.latestRound' latest.json)
          else
            ROUND=72
          fi
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      - name: Fetch JSON
        run: |
          ROUND=${{ steps.latest.outputs.round }}
          mkdir -p tmp

          # area-0 ～ area-61（62エリア）
          for AREA in $(seq -w 0 61); do
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${AREA}.json"
            echo "Fetching $URL"
            curl -f -s "$URL" -o "tmp/round-${ROUND}_area-${AREA}.json" \
              || echo "{}" > "tmp/round-${ROUND}_area-${AREA}.json"
          done

      - name: Merge JSON
        run: |
          ROUND=${{ steps.latest.outputs.round }}
          jq -s --arg round "$ROUND" '{round: $round, generatedAt: now, data: .}' tmp/*.json > latest.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest.json tmp/
          git commit -m "Auto update: round ${{ steps.latest.outputs.round }}" || echo "No changes"
          git push
