name: Auto Fetch InitialDAC JSON (v3 - latest.json based)

on:
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ▼ ① latest.json を GitHub から取得
      - name: Fetch latest.json
        run: |
          curl -s -o latest.json \
            https://pand-gthb.github.io/initialdac-round-data-auto-json-00/latest.json

      # ▼ ② latestRound を読み取る
      - name: Read latest round
        id: round
        run: |
          ROUND=$(jq -r '.latestRound' latest.json)
          echo "Latest round = $ROUND"
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      # ▼ ③ 全エリア JSON を並列取得
      - name: Fetch JSON (parallel)
        run: |
          ROUND=${{ steps.round.outputs.round }}
          mkdir -p tmp

          export ROUND

          seq 0 62 | xargs -I{} -P 20 sh -c '
            AREA={}
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${AREA}.json"
            echo "Fetching $URL"
            curl -f -s "$URL" -o tmp/area-${AREA}.json || echo "{}" > tmp/area-${AREA}.json
          '

      # ▼ ④ jq で統合（Pさんの v2 と同じ）
      - name: Merge JSON (single jq pass)
        run: |
          ROUND=${{ steps.round.outputs.round }}

          jq -s --arg round "$ROUND" '
            (map(.calcDate // empty) | sort | last) as $max
            |
            {
              round: ($round | tonumber),
              generatedAt: $max,
              records: (
                map(.records // [])
                | add
                | map(del(.calcDate))
              )
            }
          ' tmp/*.json > "round${ROUND}.json"

      # ▼ ⑤ minify（v2 と同じ）
      - name: Minify JSON
        run: |
          ROUND=${{ steps.round.outputs.round }}
          jq -c '.' "round${ROUND}.json" > "round${ROUND}.min.json"
          mv "round${ROUND}.min.json" "round${ROUND}.json"

      # ▼ ⑥ 変更があれば commit & push
      - name: Commit & Push (only if changed)
        run: |
          ROUND=${{ steps.round.outputs.round }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "round${ROUND}.json"

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update (minified): round ${ROUND}"
          git push
