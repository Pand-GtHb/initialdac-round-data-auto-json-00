name: Auto Fetch InitialDAC JSON

on:
  schedule:
    - cron: "*/20 * * * *"   # 20分ごと
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Determine latest round
        id: round
        run: |
          if [ -f latest.json ]; then
            LATEST=$(jq -r '.latestRound' latest.json)
          else
            LATEST=72
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Fetch 63 JSON files
        run: |
          mkdir -p tmp
          ROUND=${{ steps.round.outputs.latest }}

          echo "Fetching round $ROUND ..."

          for i in $(seq 0 62); do
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${i}.json"
            OUT="tmp/$i.json"

            echo "Fetching $URL"

            curl -s "$URL" -o "$OUT"

            # JSON破損チェック
            if ! jq empty "$OUT" 2>/dev/null; then
              echo "❌ JSON parse error at area $i"
              exit 1
            fi
          done

      - name: Merge JSON
        run: |
          ROUND=${{ steps.round.outputs.latest }}

          # records[] を統合
          jq -s '
            map(.records) | add
          ' tmp/*.json > merged_records.json

          # updateDate の最大値を取得
          MAX_DATE=$(jq -r '.[].updateDate' tmp/*.json | sort -r | head -n 1)

          # roundXX.json を生成
          jq -n \
            --arg round "$ROUND" \
            --arg update "$MAX_DATE" \
            --slurpfile rec merged_records.json '
            {
              round: ($round | tonumber),
              updateDate: $update,
              records: $rec[0]
            }
          ' > "round${ROUND}.json"

          # latest.json を生成
          jq -n \
            --arg round "$ROUND" \
            --arg update "$MAX_DATE" '
            {
              latestRound: ($round | tonumber),
              updateDate: $update
            }
          ' > latest.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest.json round*.json
          git commit -m "Auto update: round ${{ steps.round.outputs.latest }}" || echo "No changes"
          git push
