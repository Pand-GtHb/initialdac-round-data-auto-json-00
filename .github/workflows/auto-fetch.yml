name: Auto Fetch InitialDAC JSON

on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch HTML
        run: |
          curl -s "https://initiald.sega.jp/inidac/ranking/#/round-point/" -o page.html

      - name: Extract latest seasonName
        id: season
        run: |
          SEASON=$(grep -oP "<option value=\"\

\[object Object\\]

\">.*?</option>" page.html \
            | head -n 1 \
            | sed -E "s/.*>(.*)<.*/\\1/")
          echo "seasonName=$SEASON" >> $GITHUB_OUTPUT

      - name: Extract latest round and roundName
        id: roundinfo
        run: |
          LINE=$(grep -oP "<option value=\"(?!all)[0-9]+\">.*?</option>" page.html | head -n 1)

          ROUND=$(echo "$LINE" | sed -E "s/.*value=\"([0-9]+)\".*/\\1/")
          RNAME=$(echo "$LINE" | sed -E "s/.*>(.*)<.*/\\1/")

          echo "round=$ROUND" >> $GITHUB_OUTPUT
          echo "roundName=$RNAME" >> $GITHUB_OUTPUT

      - name: Extract areaMap
        run: |
          mkdir -p meta
          echo "{" > meta/areaMap.json

          grep -oP "<option value=\"[0-9]+\">.*?</option>" page.html \
            | sed -E "s/.*value=\"([0-9]+)\">(.*)<.*/\\1 \\2/" \
            | while read NUM NAME; do
                PAD=$(printf "%02d" "$NUM")
                echo "\"$PAD\": \"$NAME\"," >> meta/areaMap.json
              done

          sed -i '$ s/,$//' meta/areaMap.json
          echo "}" >> meta/areaMap.json

      - name: Update roundMap.json
        run: |
          mkdir -p meta

          ROUND=${{ steps.roundinfo.outputs.round }}
          SEASON=${{ steps.season.outputs.seasonName }}
          RNAME=${{ steps.roundinfo.outputs.roundName }}

          if [ ! -f meta/roundMap.json ]; then
            echo "{}" > meta/roundMap.json
          fi

          jq --arg r "$ROUND" \
             --arg s "$SEASON" \
             --arg rn "$RNAME" \
             '.[$r] = {seasonName: $s, roundName: $rn}' \
             meta/roundMap.json > meta/tmp.json

          mv meta/tmp.json meta/roundMap.json

      - name: Fetch 63 JSON files
        run: |
          mkdir -p tmp
          ROUND=${{ steps.roundinfo.outputs.round }}

          for i in $(seq 0 62); do
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${i}.json"
            OUT="tmp/$i.json"

            curl -s "$URL" -o "$OUT"

            if ! jq empty "$OUT" 2>/dev/null; then
              echo "❌ JSON parse error at area $i"
              exit 1
            fi
          done

      - name: Merge JSON with area info
        run: |
          ROUND=${{ steps.roundinfo.outputs.round }}

          jq -n '
            [inputs as $in
              | ($in.records // [])
              | map(. + {
                  area: (input_filename
                    | capture("tmp/(?<num>[0-9]+).json")
                    | .num
                    | tonumber
                    | tostring
                    | lpad(2;"0")
                  )
                }
                | del(.carname)
              )
            ] | add
          ' tmp/*.json > merged_records.json

          MAX_DATE=$(jq -r '.[].updateDate' tmp/*.json | sort -r | head -n 1)
          GEN_DATE=$(TZ="Asia/Tokyo" date +"%Y/%m/%d %H:%M:%S")

          jq -n \
            --arg round "$ROUND" \
            --arg update "$MAX_DATE" \
            --arg gen "$GEN_DATE" \
            --slurpfile rec merged_records.json '
            {
              round: ($round | tonumber),
              updateDate: $update,
              generatedAt: $gen,
              records: $rec[0]
            }
          ' > "round${ROUND}.json"

          jq -n \
            --arg round "$ROUND" \
            --arg update "$MAX_DATE" \
            --arg gen "$GEN_DATE" '
            {
              latestRound: ($round | tonumber),
              updateDate: $update,
              generatedAt: $gen
            }
          ' > latest.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest.json round*.json meta/areaMap.json meta/roundMap.json
          git commit -m "Auto update: round ${{ steps.roundinfo.outputs.round }}" || echo "No changes"
          git push
