name: Auto Integrate InitialDAC JSON (reduce + parallel fetch)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-integrate
  cancel-in-progress: true

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ▼ ① latest_round.json を取得
      - name: Fetch latest_round.json
        run: |
          curl -f -s -o latest_round.json \
            https://pand-gthb.github.io/initialdac-round-data-auto-json-00/latest_round.json

      # ▼ ② latestRound を読み取る
      - name: Read latest round
        id: round
        run: |
          ROUND=$(jq -r '.latestRound' latest_round.json)
          echo "Latest round = $ROUND"
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      # ▼ ③ 全エリア JSON を 20 並列で取得（失敗時は {} を書き込む）
      - name: Fetch JSON (parallel 20)
        run: |
          mkdir -p tmp
          export ROUND=${{ steps.round.outputs.round }}

          seq 0 62 | xargs -I{} -P 20 sh -c '
            AREA={}
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${AREA}.json"
            OUT="tmp/area-${AREA}.json"

            echo "Fetching $URL"

            # 成功 → そのまま保存
            # 失敗 → 空 JSON {} を保存（reduce が壊れない）
            if curl -f -s "$URL" -o "$OUT"; then
              echo "OK: area $AREA"
            else
              echo "{}" > "$OUT"
              echo "FAILED: area $AREA → {} に置換"
            fi
          '

      # ▼ ④ jq reduce（area を fetch 時に埋め込んでいるので filename 解析不要）
      - name: Merge JSON (reduce optimized)
        run: |
          jq -n '
            # tmp/*.json を読み込み、ファイル名から area を抽出して埋め込む
            [inputs as $data |
              {
                area: (input_filename | capture("area-(?<n>[0-9]+)\\.json").n | tonumber),
                data: $data
              }
            ] as $files
            |
            # calcDate の最大値を generatedAt にする
            ($files | map(.data.calcDate // empty) | sort | last) as $max
            |
            {
              generatedAt: $max,
              records: (
                reduce $files[] as $f (
                  [];
                  . + (
                    reduce ($f.data.records // [])[] as $r (
                      [];
                      . + [
                        (
                          $r
                          + { area: $f.area }
                          | del(.carname)
                        )
                      ]
                    )
                  )
                )
              )
            }
          ' tmp/*.json > integrated_data.json

      # ▼ ⑤ minify（差分最小化）
      - name: Minify JSON
        run: |
          jq -c '.' integrated_data.json > integrated_data.min.json
          mv integrated_data.min.json integrated_data.json

      # ▼ ⑥ GitHub へコミット（integrated_data.json）
      - name: Commit integrated_data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add integrated_data.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update integrated_data.json (round ${{ steps.round.outputs.round }})"
          git push
