name: Auto Integrate InitialDAC JSON (latest_round.json based)

on:
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ▼ ① latest_round.json を取得
      - name: Fetch latest_round.json
        run: |
          curl -s -o latest_round.json \
            https://pand-gthb.github.io/initialdac-round-data-auto-json-00/latest_round.json

      # ▼ ② latestRound を読み取る
      - name: Read latest round
        id: round
        run: |
          ROUND=$(jq -r '.latestRound' latest_round.json)
          echo "Latest round = $ROUND"
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      # ▼ ③ 全エリア JSON を並列取得（0〜62）
      - name: Fetch JSON (parallel)
        run: |
          mkdir -p tmp
          for AREA in $(seq 0 62); do
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${{ steps.round.outputs.round }}_area-${AREA}.json"
            echo "Fetching $URL"
            curl -s -o "tmp/area-${AREA}.json" "$URL"
          done

      # ▼ ④ jq で統合（slurp モードで filename を正しく取得）
      - name: Merge JSON
        run: |
          jq -s '
            # $files = [{filename, data}, ...]
            map({filename: input_filename, data: .}) as $files
            |
            # 最新 calcDate を取得
            ($files | map(.data.calcDate // empty) | sort | last) as $max
            |
            {
              generatedAt: $max,
              records: (
                $files
                | map(
                    .data.records // []
                    | map(
                        . + {
                          area: (
                            .filename
                            | split("/")[-1]        # area-XX.json
                            | split("-")[1]
                            | split(".")[0]
                            | tonumber
                          )
                        }
                        | del(.carname)
                    )
                  )
                | add
              )
            }
          ' tmp/*.json > integrated_data.json

      # ▼ ⑤ minify
      - name: Minify JSON
        run: |
          jq -c '.' integrated_data.json > integrated_data.min.json
          mv integrated_data.min.json integrated_data.json

      # ▼ ⑥ GitHub へコミット
      - name: Commit integrated_data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add integrated_data.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update integrated_data.json (round ${{ steps.round.outputs.round }})"
          git push
