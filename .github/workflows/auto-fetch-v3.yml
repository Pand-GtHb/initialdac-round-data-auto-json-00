name: Auto Integrate InitialDAC JSON (reduce + parallel fetch)

on:
  workflow_dispatch:

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ▼ ① latest_round.json を取得
      - name: Fetch latest_round.json
        run: |
          curl -s -o latest_round.json \
            https://pand-gthb.github.io/initialdac-round-data-auto-json-00/latest_round.json

      # ▼ ② latestRound を読み取る
      - name: Read latest round
        id: round
        run: |
          ROUND=$(jq -r '.latestRound' latest_round.json)
          echo "Latest round = $ROUND"
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      # ▼ ③ 全エリア JSON を 20 並列で取得（最速）
      - name: Fetch JSON (parallel 20)
        run: |
          mkdir -p tmp
          export ROUND=${{ steps.round.outputs.round }}

          seq 0 62 | xargs -I{} -P 20 sh -c '
            AREA={}
            URL="https://initiald.sega.jp/inidac/json/ranking/v1/roundPoint/rp_round-${ROUND}_area-${AREA}.json"
            echo "Fetching $URL"
            curl -s -o tmp/area-${AREA}.json "$URL"
          '

      # ▼ ④ jq reduce で高速統合（1パス処理）
      - name: Merge JSON (reduce optimized)
        run: |
          jq -n '
            [inputs | {filename: input_filename, data: .}] as $files
            |
            ($files | map(.data.calcDate // empty) | sort | last) as $max
            |
            {
              generatedAt: $max,
              records: (
                reduce $files[] as $f (
                  [];
                  . + (
                    reduce ($f.data.records // [])[] as $r (
                      [];
                      . + [
                        (
                          $r
                          + {
                              area:
                                ($f.filename
                                  | split("/")[-1]
                                  | split("-")[1]
                                  | split(".")[0]
                                  | tonumber
                                )
                            }
                          | del(.carname)
                        )
                      ]
                    )
                  )
                )
              )
            }
          ' tmp/*.json > integrated_data.json

      # ▼ ⑤ minify
      - name: Minify JSON
        run: |
          jq -c '.' integrated_data.json > integrated_data.min.json
          mv integrated_data.min.json integrated_data.json

      # ▼ ⑥ GitHub へコミット（integrated_data.json）
      - name: Commit integrated_data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add integrated_data.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update integrated_data.json (round ${{ steps.round.outputs.round }})"
          git push

      # ▼ ⑦ latest_update.json を生成（JST）
      - name: Generate latest_update.json
        run: |
          ROUND=${{ steps.round.outputs.round }}
          NOW_JST=$(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M:%S")

          echo "{
            \"lastUpdated\": \"${NOW_JST}\",
            \"round\": ${ROUND}
          }" > latest_update.json

      # ▼ ⑧ latest_update.json をコミット
      - name: Commit latest_update.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest_update.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update latest_update.json (round ${{ steps.round.outputs.round }})"
          git push
