<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>InitialD Round Data Viewer（auto-json-00）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ★ スマホでのキャッシュ完全禁止（最重要） -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 10px;
    background: #f5f5f5;
}

#logBox {
    background: #222;
    padding: 10px;
    font-size: 12px;
    white-space: pre-wrap;
    height: 120px;
    overflow-y: auto;
    border-radius: 6px;
    margin: 15px 0;
    width: 95%;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
}
th {
    background: #0078D4;
    color: white;
    padding: 6px;
}
td {
    border: 1px solid #ccc;
    padding: 6px;
    background: transparent;
}
td.left { text-align:left; }
td.right { text-align:right; }
td.center { text-align:center; }
.clickable { cursor: pointer; color: #0078d4; font-weight: bold; }

#summaryView, #detailView { margin-top: 20px; }
#detailView { display: none; }
#matchingView { margin-top: 20px; display: none; }

.bar-wrap {
    width: 100%;
    background: #ddd;
    height: 12px;
    border-radius: 4px;
}
.bar {
    height: 12px;
    background: #0078D4;
    border-radius: 4px;
}

.mt10 { margin-top:10px; }

.player-name {
    white-space: nowrap;
    overflow: hidden;
}

.store-name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.2em;
    max-height: calc(1.2em * 2);
    white-space: normal;
    overflow-wrap: anywhere;
    min-width: 150px;
}

/* ---------------------------------------------------------
   ★ periodBox（旧構造）※互換のため残すが使用しない
--------------------------------------------------------- */
#periodBox {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 2px;
    column-gap: 6px;
    margin-top: 5px;
}

#periodBox .label,
.filter-label {
    width: 5em;
    text-align: right;
    padding-right: 6px;
    font-weight: bold;
    white-space: nowrap;
}

/* ★ ここを上書きして空白を消す */
.filter-label {
    width: 0 !important;
    padding-right: 0 !important;
}

/* ---------------------------------------------------------
   ★ ランク移動ボタン
--------------------------------------------------------- */
.rank-nav-box {
    display: flex;
    align-items: center;
    margin-top: 10px;
    margin-bottom: 8px;
}

.rank-nav-btn {
    padding: 6px 14px;
    font-size: 14px;
}

#nextRankBtn {
    margin-left: 40px;
}

/* ---------------------------------------------------------
   ★ Reload ボタンの色制御
--------------------------------------------------------- */
.update-alert {
    background-color: #ff8800 !important;
    color: #fff !important;
}

/* ---------------------------------------------------------
   ★ マッチング可能性フラグ
--------------------------------------------------------- */
.match-row-pink {
    background-color: #FFE4EC !important;
}

/* ---------------------------------------------------------
   ★ サマリ行の左側にボタンを置く枠
--------------------------------------------------------- */
#summaryHeader {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}
#summaryHeaderText {
    font-weight: bold;
}

/* ---------------------------------------------------------
   ★ マッチング候補 + 検索窓
--------------------------------------------------------- */
#searchRow {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 95%;
    margin-top: 10px;
}

#searchInput {
    flex: 1;
    padding: 6px 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 95%;
}

/* ---------------------------------------------------------
   ★ script.js が生成する RUBY/PRIDE の行
--------------------------------------------------------- */
.filter-row {
    display: flex;
    align-items: center;
    margin-top: 6px;
}

/* ★ 既存の label 指定（スマホ時に上書きする） */
.filter-items label {
    display: inline-flex;
    align-items: center;
    min-width: 3.5em;
    margin-right: 6px;
}

/* ---------------------------------------------------------
   ★ 3列レイアウト
--------------------------------------------------------- */
.row3 {
    display: grid;
    grid-template-columns: 6em 1em auto;
    align-items: center;
    margin-top: 6px;
}

/* ---------------------------------------------------------
   ★ 追加：ruby-btn / pride-btn（script.js が付与）
--------------------------------------------------------- */
.ruby-btn,
.pride-btn {
    display: inline-flex;
    align-items: center;
}

/* ---------------------------------------------------------
   ★ スマホ最適化：RUBY/PRIDE ボタンを 1 行に収める
--------------------------------------------------------- */
@media (max-width: 480px) {

    /* ← 最重要：既存CSSを強制上書き */
    .filter-items label {
        min-width: auto !important;
        margin-right: 2px !important;
        padding: 0 1px !important;
        font-size: 13px !important;
        display: inline-flex !important;
    }

    .filter-items label input {
        transform: scale(0.9);
        margin-right: 1px;
    }
}
</style>
</head>

<body>

<h2>InitialD Round Data Viewer（auto-json-00 対応）</h2>

<div>
  <b>最新ラウンド：</b>
  <span id="latestRound">読み込み中…</span>
</div>

<div class="mt10">
  <b>時間フィルタ：</b>
  <select id="rangeSelect">
      <option value="15">15分</option>
      <option value="30">30分</option>
      <option value="60" selected>1時間</option>
      <option value="120">2時間</option>
      <option value="180">3時間</option>
  </select>
</div>

<!-- ★ 表示開始 -->
<div class="row3">
  <div class="label">表示開始</div>
  <div class="colon">：</div>
  <div class="value"><span id="filterStartTime">-</span></div>
</div>

<!-- ★ JSON更新 -->
<div class="row3">
  <div class="label">JSON更新</div>
  <div class="colon">：</div>
  <div class="value"><span id="jsonUpdateTime">-</span></div>
</div>

<!-- ★ RUBY -->
<div class="row3 mt10">
  <div class="label">RUBY</div>
  <div class="colon">：</div>
  <div class="value"><div id="rubyFilters"></div></div>
</div>

<!-- ★ PRIDE -->
<div class="row3">
  <div class="label">PRIDE</div>
  <div class="colon">：</div>
  <div class="value"><div id="prideFilters"></div></div>
</div>

<div class="mt10">
  <button id="reloadBtn">最新データ取得</button>
  <button id="filterBtn" style="margin-left:10px;">フィルタ適用</button>
  <button id="summaryCsvBtn" style="margin-left:10px;">サマリCSV出力</button>
  <button id="allCsvBtn" style="margin-left:10px;">全データCSV出力</button>
</div>

<div id="logBox"></div>

<div id="searchRow">
    <button id="matchingBtn">マッチング候補</button>
    <input id="searchInput" type="text" placeholder="プレイヤー名で絞り込み（ランク横断）" />
</div>

<div id="summaryView">
  <div id="summaryHeader">
      <span id="summaryHeaderText"></span>
  </div>
  <div id="summaryArea"></div>
</div>

<div id="detailView">
  <button id="backBtn">← サマリに戻る</button>

  <div class="rank-nav-box">
      <button id="prevRankBtn" class="rank-nav-btn">← 前のランク</button>
      <button id="nextRankBtn" class="rank-nav-btn">次のランク →</button>
  </div>

  <div id="detailArea" class="mt10"></div>
</div>

<div id="matchingView">
  <button id="matchingBackBtn">← サマリに戻る</button>
  <div id="matchingHeader" class="mt10"></div>
  <div id="matchingArea" class="mt10"></div>
</div>

<script src="script.js?cb=4"></script>

</body>
</html>
