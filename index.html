<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>InitialD Round Data Viewer（auto-json-00）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 10px;
    background: #f5f5f5;
}
#logBox {
    background: #222;
    padding: 10px;
    font-size: 13px;
    white-space: pre-wrap;
    height: 200px;
    overflow-y: auto;
    border-radius: 6px;
    margin: 20px 0;
}
table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
}
th {
    background: #0078D4;
    color: white;
    padding: 6px;
}
td {
    border: 1px solid #ccc;
    padding: 6px;
}
td.left{text-align:left;}
td.right{text-align:right;}
td.center{text-align:center;}
.clickable { cursor: pointer; color: #0078d4; font-weight: bold; }
#summaryView, #detailView { margin-top: 20px; }
#detailView { display: none; }

/* バーグラフ */
.bar-wrap {
    width: 100%;
    background: #ddd;
    height: 12px;
    border-radius: 4px;
}
.bar {
    height: 12px;
    background: #0078D4;
    border-radius: 4px;
}

/* 共通余白 */
.mt10 { margin-top:10px; }
</style>
</head>

<body>

<h2>InitialD Round Data Viewer（auto-json-00 対応）</h2>

<div>
  <b>最新ラウンド：</b>
  <span id="latestRound">読み込み中…</span>
</div>

<!-- 時間フィルタ＋表示期間 -->
<div class="mt10">
  <b>時間フィルタ：</b>
  <select id="rangeSelect">
      <option value="15">15分</option>
      <option value="30" selected>30分</option>
      <option value="60">1時間</option>
      <option value="120">2時間</option>
      <option value="180">3時間</option>
  </select>

  <span style="margin-left:20px;">
    <b>表示期間：</b>
    <span id="filterStartTime">-</span>
     ～ 
    <span id="jsonUpdateTime">-</span>
  </span>
</div>

<!-- Ruby星数フィルタ -->
<div class="mt10">
  <b>Ruby星数フィルタ：</b><br>
  <span id="rubyFilters"></span>
</div>

<!-- ボタン群 -->
<div class="mt10">
  <button id="reloadBtn">最新データ取得</button>
  <button id="filterBtn" style="margin-left:10px;">フィルタ適用</button>
  <button id="summaryCsvBtn" style="margin-left:10px;">サマリCSV出力</button>
  <button id="allCsvBtn" style="margin-left:10px;">全データCSV出力</button>
</div>

<div id="logBox"></div>

<div id="summaryView">
  <h3 id="summaryTitle">稼働プレイヤー（合計：0人）</h3>
  <div id="summaryArea"></div>
</div>

<div id="detailView">
  <h3>詳細一覧</h3>
  <button id="backBtn">← サマリに戻る</button>
  <div id="detailArea" class="mt10"></div>
</div>

<!-- script.js 読み込み（キャッシュバスター付き） -->
<script src="script.js?cb=1"></script>

</body>
</html>
