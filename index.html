<!DOCTYPE html>
<head><html lang="ja">
  <meta charset="UTF-8">
  <title>Initial DAC Round Data Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 10px;
      background: #000;
      color: #fff;
    }

    .button-row {
      display: flex;
      flex-wrap: nowrap;       /* ★折り返し防止 */
      gap: 4px;
      margin-bottom: 8px;
    }

    .button-row button {
      font-size: 12px;         /* ★スマホ対策 */
      padding: 6px 8px;
      white-space: nowrap;     /* ★改行防止 */
    }

    h3 {
      margin: 8px 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #444;
      padding: 4px;
    }

    th {
      white-space: nowrap;
    }

    .center { text-align: center; }
    .right { text-align: right; }
    .left { text-align: left; }

    .bar {
      height: 6px;
      background: #00c853;
    }

    .bar-wrap {
      width: 100%;
      background: #333;
    }

    .clickable {
      cursor: pointer;
    }

  </style>
</head>

<body>

  <!-- =========================
       上部情報
  ========================== -->
  <div>
    <div>最新ラウンド：<span id="latestRound">読み込み中…</span></div>
    <div>時間フィルタ：<span id="rangeSelect">15分</span></div>
    <div>表示開始：<span id="filterStartTime">-</span></div>
    <div>JSON更新：<span id="jsonUpdateTime">-</span></div>
  </div>

  <!-- =========================
       ボタン群（ここが今回の主修正）
  ========================== -->
  <div id="buttonArea">
    <div class="button-row">
      <button id="reloadBtn">最新データ取得</button>
      <button id="filterBtn">フィルタ適用</button>
      <button id="summaryCsvBtn">サマリCSV</button>
      <button id="allCsvBtn">全データCSV</button>
      <button id="exportJsonBtn">本日分Log</button>
    </div>
  </div>

  <!-- =========================
       フィルタ
  ========================== -->
  <div id="rubyFilters"></div>
  <div id="prideFilters"></div>

  <!-- =========================
       ナビゲーション
  ========================== -->
  <div>
    <button id="matchingBtn">マッチング候補</button>
    <button id="backBtn">← サマリに戻る</button>
  </div>

  <!-- =========================
       検索
  ========================== -->
  <input id="searchInput" placeholder="検索">

  <!-- =========================
       表示エリア
  ========================== -->

  <!-- サマリ -->
  <div id="summaryView">
    <div id="summaryArea"></div>
  </div>

  <!-- 詳細 -->
  <div id="detailView" style="display:none;">
    <button id="prevRankBtn">← 前のランク</button>
    <button id="nextRankBtn">次のランク →</button>
    <div id="detailArea"></div>
  </div>

  <!-- マッチング -->
  <div id="matchingView" style="display:none;">
    <button id="matchingBackBtn">← サマリに戻る</button>
    <div id="matchingHeader"></div>
    <div id="matchingArea"></div>
  </div>

  <!-- =========================
       ログ
  ========================== -->
  <div id="logBox" style="font-size:11px; margin-top:10px;"></div>

  <!-- =========================
       スクリプト
  ========================== -->
  <script src="script.js"></script>

</body>
</html>
