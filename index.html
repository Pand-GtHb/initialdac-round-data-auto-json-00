<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>InitialD Round Data Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 10px;
    background: #f5f5f5;
}
h2 {
    margin-top: 0;
}
#logBox {
    background: #222;
    color: #0f0;
    padding: 10px;
    font-size: 13px;
    white-space: pre-wrap;
    height: 200px;
    overflow-y: auto;
    border-radius: 6px;
}
table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
}
th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
}
th {
    background: #eee;
}
.clickable {
    cursor: pointer;
    color: #0078d4;
    font-weight: bold;
}
.bar {
    width: 100px;
    height: 10px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
    margin: auto;
}
.bar-inner {
    height: 100%;
    background: #4da3ff;
}
#summaryView, #detailView {
    margin-top: 20px;
}
#detailView {
    display: none;
}
</style>
</head>

<body>

<h2>InitialD Round Data Viewer（auto-json-00 対応）</h2>

<!-- 最新ラウンド番号 -->
<div>
    <b>最新ラウンド：</b>
    <span id="latestRound">読み込み中…</span>
</div>

<!-- JSON更新日時 -->
<div style="margin-top:10px;">
    <b>JSON更新日時：</b>
    <span id="jsonUpdateTime">読み込み中…</span>
</div>

<!-- ボタン -->
<div style="margin-top:10px;">
    <button id="reloadBtn">最新データを再取得</button>
    <button id="csvBtn" style="margin-left:10px;">CSV出力</button>
</div>

<!-- デバッグログ -->
<h3 style="margin-top:20px;">デバッグログ</h3>
<div id="logBox">（ここに fetch の成功/失敗が表示されます）</div>

<!-- サマリ表示 -->
<div id="summaryView">
    <h3>ランク帯サマリ（星数＋PRIDE帯）</h3>
    <div id="summaryArea"></div>
</div>

<!-- 詳細表示 -->
<div id="detailView">
    <h3>詳細一覧</h3>
    <button id="backBtn">← サマリに戻る</button>
    <div id="detailArea" style="margin-top:10px;"></div>
</div>

<script src="script.js"></script>
</body>
</html>
