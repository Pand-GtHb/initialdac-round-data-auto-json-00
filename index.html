<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>InitialD Round Data Viewer（auto-json-00）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ★ スマホでのキャッシュ完全禁止（最重要） -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 10px;
    background: #f5f5f5;
}

#logBox {
    background: #222;
    padding: 10px;
    font-size: 12px;
    white-space: pre-wrap;
    height: 120px;
    overflow-y: auto;
    border-radius: 6px;
    margin: 15px 0;
    width: 95%;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
}
th {
    background: #0078D4;
    color: white;
    padding: 6px;
}
td {
    border: 1px solid #ccc;
    padding: 6px;
    background: transparent;
}
td.left { text-align:left; }
td.right { text-align:right; }
td.center { text-align:center; }
.clickable { cursor: pointer; color: #0078d4; font-weight: bold; }
#summaryView, #detailView { margin-top: 20px; }
#detailView { display: none; }
#matchingView { margin-top: 20px; display: none; }

.bar-wrap {
    width: 100%;
    background: #ddd;
    height: 12px;
    border-radius: 4px;
}
.bar {
    height: 12px;
    background: #0078D4;
    border-radius: 4px;
}

.mt10 { margin-top:10px; }

.player-name {
    white-space: nowrap;
    overflow: hidden;
}

.store-name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;

    line-height: 1.2em;
    max-height: calc(1.2em * 2);

    white-space: normal;
    overflow-wrap: anywhere;

    min-width: 150px;

    background: transparent !important;
    background-color: transparent !important;
    background-clip: padding-box !important;
}

.rp-col {
    max-width: 50px;
    white-space: nowrap;
    overflow: hidden;
}

.title-col {
    max-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.update-col {
    max-width: 95px;
    white-space: nowrap;
}

#periodBox {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 2px;
    column-gap: 6px;
    margin-top: 5px;
}
#periodBox .label {
    text-align: right;
    font-weight: bold;
}
#periodBox .value {
    text-align: left;
}

.rank-nav-box {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    margin-top: 10px;
    margin-bottom: 8px;
}

.rank-nav-btn {
    padding: 6px 14px;
    font-size: 14px;
}

#nextRankBtn {
    margin-left: 40px;
}

/* ---------------------------------------------------------
   ★ Reload ボタンの色制御（更新検知時のみオレンジ）
--------------------------------------------------------- */
.update-alert {
    background-color: #ff8800 !important;
    color: #fff !important;
}

/* ---------------------------------------------------------
   ★ 5分刻みマッチング可能性フラグ（淡いピンク）
--------------------------------------------------------- */
.match-row-pink {
    background-color: #FFE4EC !important;
}

/* ---------------------------------------------------------
   ★ 新規追加：Ruby星・PRIDE 共通の列幅固定
--------------------------------------------------------- */
.star-pride-col {
    width: 4em;
    max-width: 4em;
    text-align: center;
    white-space: normal;
    line-height: 1.2em;
}

/* ---------------------------------------------------------
   ★ 新規追加：サマリ行の左側にボタンを置く枠
--------------------------------------------------------- */
#summaryHeader {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}
#summaryHeaderText {
    font-weight: bold;
}

/* ---------------------------------------------------------
   ★ Rubyフィルタ & PRIDEフィルタ（左右位置を完全一致）
--------------------------------------------------------- */
.filter-grid {
    display: grid;
    grid-template-columns: 120px repeat(8, 1fr); /* 左ラベル + 8列 */
    gap: 4px 8px;
    align-items: center;
    margin-top: 8px;
}
.filter-label {
    font-weight: bold;
    text-align: right;
    padding-right: 6px;
}
</style>
</head>

<body>

<h2>InitialD Round Data Viewer（auto-json-00 対応）</h2>

<div>
  <b>最新ラウンド：</b>
  <span id="latestRound">読み込み中…</span>
</div>

<div class="mt10">
  <b>時間フィルタ：</b>
  <select id="rangeSelect">
      <option value="15">15分</option>
      <option value="30">30分</option>
      <option value="60" selected>1時間</option>
      <option value="120">2時間</option>
      <option value="180">3時間</option>
  </select>

  <div id="periodBox">
      <div class="label">表示開始：</div>
      <div class="value"><span id="filterStartTime">-</span></div>

      <div class="label">JSON更新：</div>
      <div class="value"><span id="jsonUpdateTime">-</span></div>
  </div>
</div>

<!-- ★★★ Rubyフィルタ + PRIDEフィルタ（2行グリッド） ★★★ -->
<div class="mt10">

  <!-- 1行目：Rubyフィルタ -->
  <div class="filter-grid">
    <div class="filter-label">Rubyフィルタ：</div>
    <label><input type="checkbox" class="ruby-filter" value="1" checked> ★1</label>
    <label><input type="checkbox" class="ruby-filter" value="2" checked> ★2</label>
    <label><input type="checkbox" class="ruby-filter" value="3" checked> ★3</label>
    <label><input type="checkbox" class="ruby-filter" value="4" checked> ★4</label>
    <label><input type="checkbox" class="ruby-filter" value="5" checked> ★5</label>
    <label><input type="checkbox" class="ruby-filter" value="6" checked> ★6</label>
    <label><input type="checkbox" class="ruby-filter" value="7" checked> ★7</label>
    <label><input type="checkbox" class="ruby-filter" value="8" checked> ★8</label>
  </div>

  <!-- 2行目：PRIDEフィルタ -->
  <div class="filter-grid">
    <div class="filter-label">PRIDEフィルタ：</div>
    <label><input type="checkbox" class="pride-filter" value="A" checked> A</label>
    <label><input type="checkbox" class="pride-filter" value="B" checked> B</label>
    <label><input type="checkbox" class="pride-filter" value="C" checked> C</label>
    <label><input type="checkbox" class="pride-filter" value="D" checked> D</label>
    <label><input type="checkbox" class="pride-filter" value="E" checked> E</label>
    <label><input type="checkbox" class="pride-filter" value="F" checked> F</label>
    <label><input type="checkbox" class="pride-filter" value="G" checked> G</label>
    <div></div> <!-- 8列目が無いので空白で揃える -->
  </div>

</div>

<div class="mt10">
  <button id="reloadBtn">最新データ取得</button>
  <button id="filterBtn" style="margin-left:10px;">フィルタ適用</button>
  <button id="summaryCsvBtn" style="margin-left:10px;">サマリCSV出力</button>
  <button id="allCsvBtn" style="margin-left:10px;">全データCSV出力</button>
</div>

<div id="logBox"></div>

<!-- ★★★ 検索窓（サマリ・詳細・候補共通） ★★★ -->
<div id="searchArea" class="mt10">
  <input
    id="searchInput"
    type="text"
    placeholder="プレイヤー名で絞り込み（ランク横断）"
    style="
      width: 95%;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    "
  />
</div>

<!-- ★★★ サマリ画面 ★★★ -->
<div id="summaryView">

  <!-- 新規追加：サマリ行の左側にボタンを置く枠 -->
  <div id="summaryHeader">
      <button id="matchingBtn">マッチング候補</button>
      <span id="summaryHeaderText"></span>
  </div>

  <div id="summaryArea"></div>
</div>

<!-- ★★★ 詳細画面 ★★★ -->
<div id="detailView">
  <button id="backBtn">← サマリに戻る</button>

  <div class="rank-nav-box">
      <button id="prevRankBtn" class="rank-nav-btn">← 前のランク</button>
      <button id="nextRankBtn" class="rank-nav-btn">次のランク →</button>
  </div>

  <div id="detailArea" class="mt10"></div>
</div>

<!-- ★★★ 新規追加：マッチング候補画面 ★★★ -->
<div id="matchingView">
  <button id="matchingBackBtn">← サマリに戻る</button>

  <!-- 上部の「☆1：2人」「PRIDE A=〜99：3人」など -->
  <div id="matchingHeader" class="mt10"></div>

  <!-- 詳細画面と同じ構成のテーブルをここに描画 -->
  <div id="matchingArea" class="mt10"></div>
</div>

<!-- ★ script.js のキャッシュバスターを cb=4 に更新 -->
<script src="script.js?cb=4"></script>

</body>
</html>
