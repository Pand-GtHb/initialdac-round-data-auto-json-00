<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Initial D THE ARCADE Data Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ★ スマホでのキャッシュ完全禁止（最重要） -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 10px;

    min-height: 100vh;
    position: relative;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: url("./images/bg_sp.jpg.webp");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;

    opacity: 0.4;

    pointer-events: none;
    z-index: -1;
}
#logBox {
    background: #222;
    padding: 10px;
    font-size: 14px;
    white-space: pre-wrap;
    height: 120px;
    overflow-y: auto;
    border-radius: 6px;
    margin: 15px 0;
    width: 95%;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
}
th {
    background: #0078D4;
    color: white;
    padding: 6px;
}
td {
    border: 1px solid #ccc;
    padding: 6px;
    background: transparent;
}
td.left { text-align:left; }
td.right { text-align:right; }
td.center { text-align:center; }
.clickable { cursor: pointer; color: #0078d4; font-weight: bold; }

#summaryView, #detailView { margin-top: 20px; }
#detailView { display: none; }
#matchingView { margin-top: 20px; display: none; }

.bar-wrap {
    width: 100%;
    background: #ddd;
    height: 12px;
    border-radius: 4px;
}
.bar {
    height: 12px;
    background: #0078D4;
    border-radius: 4px;
}

.mt10 { margin-top:10px; }

.player-name {
    white-space: nowrap;
    overflow: hidden;
}

.store-name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;

    line-height: 1.2em;
    max-height: calc(1.2em * 2);

    white-space: normal;
    overflow-wrap: anywhere;

    min-width: 150px;

    background: transparent !important;
    background-color: transparent !important;
    background-clip: padding-box !important;
}

.rp-col {
    max-width: 50px;
    white-space: nowrap;
    overflow: hidden;
}

.update-col {
    max-width: 95px;
    white-space: nowrap;
}

.title-col {
    max-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* ---------------------------------------------------------
   ★ periodBox（旧構造）※互換のため残すが使用しない
--------------------------------------------------------- */
#periodBox {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 2px;
    column-gap: 6px;
    margin-top: 5px;
}

#periodBox .label,
.filter-label {
    width: 5em;
    text-align: right;
    padding-right: 6px;
    font-weight: bold;
    font-family: inherit;
    white-space: nowrap;
}

/* ★ ここを上書きして空白を消す */
.filter-label {
    width: 0 !important;
    padding-right: 0 !important;
}

#periodBox .value {
    text-align: left;
}

/* ---------------------------------------------------------
   ★ ランク移動ボタン
--------------------------------------------------------- */
.rank-nav-box {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    margin-top: 10px;
    margin-bottom: 8px;
}

.rank-nav-btn {
    padding: 6px 14px;
    font-size: 14px;
}

#nextRankBtn {
    margin-left: 40px;
}

/* ---------------------------------------------------------
   ★ Reload ボタンの色制御
--------------------------------------------------------- */
.update-alert {
    background-color: #ff8800 !important;
    color: #fff !important;
}

/* ---------------------------------------------------------
   ★ マッチング可能性フラグ
--------------------------------------------------------- */
.match-row-pink {
    background-color: #FFE4EC !important;
}

.match-row-yellow {
    background-color: #FFFFCC !important;
}

/* ---------------------------------------------------------
   ★ Pink管理対象
   Phase中  : 背景Pink
   Phase外  : 赤文字
--------------------------------------------------------- */
.pink-managed {
    color: #ff4444 !important;
    font-weight: bold;
    background: transparent !important;
}

.pink-phase {
    background-color: #FFE4EC !important;
    color: inherit !important;
    font-weight: bold;
}

/* ---------------------------------------------------------
   ★ サマリ行の左側にボタンを置く枠
--------------------------------------------------------- */
#summaryHeader {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}
#summaryHeaderText {
    font-weight: bold;
}

/* ---------------------------------------------------------
   ★ マッチング候補 + 検索窓
--------------------------------------------------------- */
#searchRow {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 95%;
    margin-top: 10px;
}

#searchInput {
    flex: 1;
    padding: 6px 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 95%;
    max-width: 95%;
}

/* ---------------------------------------------------------
   ★ script.js が生成する RUBY/PRIDE の行
--------------------------------------------------------- */
.filter-row {
    display: flex;
    align-items: center;
    margin-top: 6px;
}

.filter-items label {
    display: inline-flex;
    align-items: center;
    min-width: 3.0em;
    margin-right: 2px;
}

/* ---------------------------------------------------------
   ★ 3列レイアウト
--------------------------------------------------------- */
.row3 {
    display: grid;
    grid-template-columns: 4em 1em auto;
    align-items: center;
    margin-top: 2px;
}

.row3 .label {
    text-align: right;
    font-weight: bold;
    white-space: nowrap;
}

.row3 .colon {
    text-align: center;
    font-weight: bold;
}

.row3 .value {
    text-align: left;
}
</style>
</head>

<body>

<h2>Initial D THE ARCADE Data Viewer</h2>

<!-- ★ ラウンド -->
<div class="row3">
  <div class="label">ROUND</div>
  <div class="colon">：</div>
  <div class="value">
    <span id="latestRound">読み込み中…</span>
    </div>
</div>

<!-- ★ 時間フィルタ -->
<div class="row3">
  <div class="label">FILTER</div>
  <div class="colon">：</div>
  <div class="value">
     <select id="rangeSelect">
        <option value="15">15 min</option>
        <option value="30">30 min</option>

        <option value="60" selected>1 hour</option>
      
        <option value="120">2 hour</option>
        <option value="180">3 hour</option>
        </select>
    </div>
</div>

<!-- ★ 表示開始 -->
<div class="row3">
  <div class="label">FROM</div>
  <div class="colon">：</div>
  <div class="value"><span id="filterStartTime">-</span></div>
</div>

<!-- ★ JSON更新 -->
<div class="row3">
  <div class="label">TO</div>
  <div class="colon">：</div>
  <div class="value"><span id="jsonUpdateTime">-</span></div>
</div>

<!-- ★ RUBY -->
<div class="row3 mt10">
  <div class="label">RUBY</div>
  <div class="colon">：</div>
  <div class="value"><div id="rubyFilters"></div></div>
</div>

<!-- ★ PRIDE -->
<div class="row3">
  <div class="label">PRIDE</div>
  <div class="colon">：</div>
  <div class="value"><div id="prideFilters"></div></div>
</div>

<!-- 各種ボタン -->
<div class="mt10">
  <button id="reloadBtn">RELOAD　</button>
  <button id="filterBtn">FLT　</button>
  <button id="summaryCsvBtn">SumCSV　</button>
  <button id="allCsvBtn">AllCSV　</button>

  <input
    type="date"
    id="logExportDate"
    title="Today"
    style="
      margin-left:8px;
      margin-right:4px;
    ">
  <button id="analysisLogBtn">LOG　</button>

</div>

<div id="logBox"></div>

<div id="searchRow">

    <select id="myRankSelect">
        <option value="R1">★1</option>
        <option value="R2">★2</option>
        <option value="R3">★3</option>
        <option value="R4">★4</option>
        <option value="R5">★5</option>

        <option value="R6" selected>★6</option>
        
        <option value="R7">★7</option>
        <option value="R8">★8</option>
        <option value="P_A">PRIDE A</option>
        <option value="P_B">PRIDE B</option>
        <option value="P_C">PRIDE C</option>
        <option value="P_D">PRIDE D</option>
        <option value="P_E">PRIDE E</option>
        <option value="P_F">PRIDE F</option>
        <option value="P_G">PRIDE G</option>
    </select>

    <button id="matchingBtn">MATCHING　</button>
    <input id="searchInput" type="text" placeholder="Filter by player name" />
</div>

<div id="summaryView">
  <div id="summaryHeader">
      <span id="summaryHeaderText"></span>
  </div>
  <div id="summaryArea"></div>
</div>

<div id="detailView">
  <button id="backBtn">◀◀◀SUMMARY</button>

  <div class="rank-nav-box">
      <button id="prevRankBtn" class="rank-nav-btn">　◀◀◀　</button>
      <button id="nextRankBtn" class="rank-nav-btn">　▶▶▶　</button>
  </div>

  <div id="detailArea" class="mt10"></div>
</div>

<div id="matchingView">
  <button id="matchingBackBtn">◀◀◀SUMMARY</button>
  <div id="matchingHeader" class="mt10"></div>
  <div id="matchingArea" class="mt10"></div>
</div>

<script src="script.js?cb=4"></script>

</body>
</html>
